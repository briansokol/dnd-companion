# Run with: docker compose --env-file env/firefly.env up
# The env file fills in the ports below; the containers read the same profile
# through the config loader (APP_ENV=firefly). Ollama runs on the host.

x-service: &service
  restart: unless-stopped
  extra_hosts:
    # Built in on Docker Desktop; needed on Linux.
    - host.docker.internal:host-gateway

services:
  web:
    <<: *service
    build:
      context: .
      target: web
    environment:
      APP_ENV: firefly
      PORT: ${WEB_PORT}
    ports:
      - ${WEB_PORT}:${WEB_PORT}
    depends_on:
      dnd-mcp:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:${WEB_PORT}/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  dnd-mcp:
    <<: *service
    build:
      context: .
      target: mcp
    environment:
      APP_ENV: firefly
    # Only web talks to dnd-mcp, so it publishes no host port.
    # Runs as the host user so files written to data/ stay yours.
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:${MCP_PORT}/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
